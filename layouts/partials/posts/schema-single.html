<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    {{- with .Title }}
      "headline": {{ partial "func/PrepareData.html" . }},
      "name": {{ partial "func/PrepareData.html" . }},
    {{ end -}}

    {{- with .Params.image }}
      {{- $schemaImage := .src | absURL -}}
      {{- if templates.Exists "partials/func/GetSchemaImageSrc.html" }}{{ $schemaImage = partial "func/GetSchemaImageSrc.html" .src }}{{ end }}
      "thumbnailUrl": {{ $schemaImage }},
    {{ end -}}

    {{- with .Date }}
      "datePublished": {{ . }},
    {{ end -}}

    {{- with .Description }}
      "description": {{ partial "func/PrepareData.html" . }},
    {{ end -}}

    {{- range .GetTerms "categories" }}
      "articleSection": {{ partial "func/PrepareData.html" .Title }},
    {{ end -}}

    {{- range .GetTerms "authors" }}
      {{- $author :=  partial "func/GetRealPerson" . -}}
      {{- with $author }}
        "author": {
          "@type": "Person",
          "name": {{ partial "func/PrepareData.html" .Title }},
          {{- with .Description }}
            "description": {{ partial "func/PrepareData.html" . }},
          {{ end }}
          "url": {{ .Permalink }}
        },
      {{ end -}}
    {{ end -}}

    {{- with .Content }}
      "articleBody": {{ partial "func/PrepareData.html" . }},
    {{ end -}}

  }
</script>
